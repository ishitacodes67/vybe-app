<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VYBE — Choose Your World</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/role-select.css">
    <link rel="stylesheet" href="css/cursor.css">

</head>

<body class="role-page">

    <header class="role-nav">

        <a href="index.html" class="brand">
            VYBE<span>✦</span>
        </a>

        <div class="role-nav-copy">
            ONE CAMPUS.<br>
            THREE WAYS IN.
        </div>

    </header>


    <main class="role-main">

        <section class="role-intro">

            <div class="eyebrow">
                YOUR VYBE STARTS HERE
            </div>

            <h1>
                what are you<br>
                <em>here to do?</em>
            </h1>

            <p>
                One campus. Different ways to experience it.
                Pick the world that feels like yours.
            </p>

        </section>


        <section class="role-grid">

            <button
                type="button"
                class="role-card role-explorer"
                data-role="member"
                data-target="member-login.html"
                data-cursor="EXPLORE"
            >

                <div class="role-card-top">
                    <span>01</span>
                    <span class="role-arrow">↗</span>
                </div>

                <div class="role-symbol">
                    ✦
                </div>

                <div class="role-card-content">

                    <span class="role-label">
                        FOR THE CURIOUS
                    </span>

                    <h2>
                        VYBE<br>
                        <em>Explorer</em>
                    </h2>

                    <p>
                        Find events, people, communities
                        and things you did not know existed.
                    </p>

                </div>

                <div class="role-card-footer">
                    DISCOVER · CONNECT · EXPERIENCE
                </div>

            </button>


            <button
                type="button"
                class="role-card role-host"
                data-role="organizer"
                data-target="organizer-login.html"
                data-cursor="HOST"
            >

                <div class="role-card-top">
                    <span>02</span>
                    <span class="role-arrow">↗</span>
                </div>

                <div class="role-symbol">
                    ◉
                </div>

                <div class="role-card-content">

                    <span class="role-label">
                        FOR THE BUILDERS
                    </span>

                    <h2>
                        VYBE<br>
                        <em>Host</em>
                    </h2>

                    <p>
                        Create experiences, bring people together
                        and build your campus presence.
                    </p>

                </div>

                <div class="role-card-footer">
                    CREATE · HOST · GROW
                </div>

            </button>


            <button
                type="button"
                class="role-card role-authority"
                data-role="authority"
                data-target="authority-login.html"
                data-cursor="VERIFY"
            >

                <div class="role-card-top">
                    <span>03</span>
                    <span class="role-arrow">↗</span>
                </div>

                <div class="role-symbol">
                    ◇
                </div>

                <div class="role-card-content">

                    <span class="role-label">
                        INSTITUTIONAL ACCESS
                    </span>

                    <h2>
                        Campus<br>
                        <em>Authority</em>
                    </h2>

                    <p>
                        Review, verify and shape the experiences
                        happening across your campus.
                    </p>

                </div>

                <div class="role-card-footer">
                    REVIEW · VERIFY · GUIDE
                </div>

            </button>

        </section>

    </main>


    <footer class="role-footer">

        <span>
            VYBE / CHOOSE YOUR WORLD
        </span>

        <span>
            ✦ YOUR ROLE SHAPES YOUR EXPERIENCE
        </span>

    </footer>


    <script src="js/api.js"></script>
<script src="js/app.js"></script>
    <script src="js/role-select.js"></script>
    <script src="js/cursor.js"></script>

</body>
</html>
