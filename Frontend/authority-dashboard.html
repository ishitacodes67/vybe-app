<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE — Authority Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vix.css">
    <link rel="stylesheet" href="css/cursor.css">

    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #111; border-right: 1px solid #333; padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; box-sizing: border-box; }
        .brand { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #fff; text-decoration: none; margin-bottom: 40px; display: block; }
        .brand span { color: #a3e635; }
        .nav-label { font-family: 'DM Mono', monospace; font-size: 11px; color: #a3e635; letter-spacing: 0.1em; margin-bottom: 15px; }
        .nav-link { display: block; color: #888; text-decoration: none; padding: 12px 0; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover, .nav-link.active { color: #fff; }
        .logout-btn { margin-top: auto; background: transparent; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        .main-content { margin-left: 260px; padding: 50px; flex: 1; box-sizing: border-box; max-width: 1200px; }
        .eyebrow { font-family: 'DM Mono', monospace; font-size: 12px; color: #a3e635; text-transform: uppercase; letter-spacing: 0.1em; }
        h1 { font-family: 'Playfair Display', serif; font-size: 48px; margin: 10px 0 40px 0; line-height: 1.1; font-weight: 500; }
        h1 em { color: #a3e635; font-style: italic; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #fff; color: #111; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .stat-label { font-family: 'DM Mono', monospace; font-size: 11px; color: #666; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 36px; font-weight: 800; margin-top: 10px; }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 50px; }
        .chart-card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .chart-card h3 { color: #111; font-size: 16px; font-weight: 700; margin-top: 0; margin-bottom: 20px; }
        .chart-container { position: relative; height: 250px; width: 100%; }

        /* Pending Events List */
        .pending-list { background: #fff; border-radius: 16px; padding: 30px; color: #111; }
        .pending-list h2 { font-size: 22px; margin-top: 0; margin-bottom: 20px; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #eee; }
        .pending-item:last-child { border-bottom: none; }
        .pending-item h4 { margin: 0; font-size: 18px; font-weight: 700; }
        .pending-item p { margin: 5px 0 0 0; color: #666; font-size: 14px; }
        .review-btn { background: #0d0d0d; color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; transition: background 0.2s; }
        .review-btn:hover { background: #333; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="authority-dashboard.html" class="brand">VYBE<span>✦</span></a>
        <div class="nav-label">AUTHORITY</div>
        <a href="authority-dashboard.html" class="nav-link active">⌂ Dashboard</a>
        <a href="event-review.html" class="nav-link">✓ Event Review</a>
        <button class="logout-btn" id="logoutButton">Log out ↗</button>
    </aside>

    <main class="main-content">
        <span class="eyebrow">VYBE AUTHORITY / DASHBOARD</span>
        <h1>Overview of <em>campus life.</em></h1>

        <section class="stats-grid">
            <div class="stat-card"><div class="stat-label">TOTAL EVENTS</div><div class="stat-value" id="totalEvents">0</div></div>
            <div class="stat-card"><div class="stat-label">PENDING REVIEWS</div><div class="stat-value" id="pendingEvents">0</div></div>
            <div class="stat-card"><div class="stat-label">TOTAL USERS</div><div class="stat-value" id="totalUsers">0</div></div>
            <div class="stat-card"><div class="stat-label">APPROVED EVENTS</div><div class="stat-value" id="approvedEvents">0</div></div>
        </section>

        <section class="charts-grid">
            <div class="chart-card">
                <h3>Events by Category</h3>
                <div class="chart-container"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Registrations (Last 7 Days)</h3>
                <div class="chart-container"><canvas id="registrationChart"></canvas></div>
            </div>
        </section>

        <!-- PENDING EVENTS LIST -->
        <section class="pending-list" id="pendingSection">
            <h2>Pending Approvals</h2>
            <div id="pendingContainer">
                <p style="color: #666;">Loading...</p>
            </div>
        </section>
    </main>

    <button class="vix-floating-button" type="button" data-vix-open aria-label="Open Vix">
        <span>✦</span>
        <strong>Vix</strong>
    </button>

    <script src="js/api.js"></script>
    <script src="js/vix.js"></script>
    <script src="js/authority.js"></script>
    <script src="js/cursor.js"></script>
    <script>
        // Extra logic to fetch the pending events list
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById('pendingContainer');
            if (!container) return;
            
            try {
                const events = await window.api.pendingEvents();
                if (events.length === 0) {
                    container.innerHTML = '<p style="color: #666;">No pending events to review right now. Great job!</p>';
                    return;
                }
                
                container.innerHTML = events.map(e => `
                    <div class="pending-item">
                        <div>
                            <h4>${e.title}</h4>
                            <p>${e.category} • ${e.date} • by ${e.organizer?.name || 'Organizer'}</p>
                        </div>
                        <a href="event-review.html?id=${e._id}" class="review-btn">Review →</a>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="color: #d93025;">Failed to load pending events.</p>';
            }
        });
    </script>
</body>
</html>
