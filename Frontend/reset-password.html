<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE — Set New Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/member-login.css">
    <link rel="stylesheet" href="css/cursor.css">
</head>

<body class="auth-page member-auth">

<main class="member-login-page">

    <section class="login-visual">
        <a href="index.html" class="login-brand">VYBE<span>✦</span></a>

        <div class="visual-content">
            <p class="visual-kicker">NEW PASSWORD</p>
            <h1>pick something <em>fresh.</em></h1>
            <p>Choose a strong password. You'll use it to sign in from now on.</p>
        </div>

        <div class="visual-bottom">
            <span>DISCOVER</span>
            <span>CONNECT</span>
            <span>PARTICIPATE</span>
            <span>GROW</span>
        </div>
    </section>


    <section class="login-panel">
        <div class="login-inner">

            <div class="login-kicker">RESET PASSWORD</div>

            <h2>choose a <em>new password.</em></h2>

            <p class="login-intro">
                At least 6 characters. Avoid reusing a password from another site.
            </p>

            <form id="resetForm" class="auth-form" novalidate>

                <div class="field">
                    <label for="newPassword">NEW PASSWORD</label>

                    <input
                        id="newPassword"
                        name="password"
                        type="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <small class="field-error" data-error-for="password"></small>
                </div>

                <div class="field">
                    <label for="confirmPassword">CONFIRM PASSWORD</label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="Type it again"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <small class="field-error" data-error-for="confirmPassword"></small>
                </div>

                <button type="submit" class="auth-submit" id="resetBtn">
                    UPDATE PASSWORD <span>→</span>
                </button>

            </form>

        </div>
    </section>

</main>


<script src="js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("newPassword");
    const confirmInput = document.getElementById("confirmPassword");
    const btn = document.getElementById("resetBtn");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    function showError(fieldName, message) {
        const field = form.querySelector(`[name="${fieldName}"]`);
        const error = form.querySelector(`[data-error-for="${fieldName}"]`);
        field?.closest(".field")?.classList.add("has-error");
        if (error) error.textContent = message;
    }

    function clearErrors() {
        form.querySelectorAll(".field").forEach(f => f.classList.remove("has-error"));
        form.querySelectorAll(".field-error").forEach(e => (e.textContent = ""));
    }

    // If no token, show error immediately
    if (!token) {
        clearErrors();
        showError("password", "Missing reset token. Please request a new link from the login page.");
        btn.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const password = passwordInput.value;
        const confirm = confirmInput.value;

        let valid = true;

        if (password.length < 6) {
            showError("password", "Password must be at least 6 characters.");
            valid = false;
        }

        if (confirm !== password) {
            showError("confirmPassword", "Passwords don't match.");
            valid = false;
        }

        if (!valid) return;

        btn.disabled = true;
        btn.innerHTML = `Updating… <span>→</span>`;

        try {
            const result = await window.api.resetPassword(token, password);

            btn.innerHTML = `Password updated ✓`;

            const note = document.createElement("p");
            note.className = "auth-success";
            note.textContent = result.message || "Password updated successfully. Redirecting to login…";
            form.appendChild(note);

            setTimeout(() => {
                window.location.href = "member-login.html";
            }, 2000);

        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = `UPDATE PASSWORD <span>→</span>`;
            showError("password", err.message || "Reset failed. Try again or request a new link.");
        }
    });
});
</script>

    <script src="js/cursor.js"></script>
</body>
</html>
